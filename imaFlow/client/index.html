<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>imaFlow</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="aiToolbar">
        <button id="aiCopyMarkBtn" title="Copy vùng chọn + tạo marker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
        <button id="aiPasteAlignBtn" title="Paste ảnh AI + canh vào marker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14l2 2 4-4"></path></svg>
        </button>
        <button id="settingsToggleBtn" title="Cài đặt">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </div>

    <div id="settingsPanel" class="hidden">
        <div class="settingsSection">
            <label>Đường dẫn GeminiWidget.exe</label>
            <div class="settingsRow">
                <input type="text" id="exePathInput" placeholder="Chưa chọn file..." />
                <button id="browseExeBtn">Chọn file...</button>
            </div>
        </div>

        <div class="settingsSection">
            <label>Prompt lưu sẵn</label>
            <textarea id="promptText" rows="5" placeholder="Soạn / dán prompt ở đây, tự lưu lại..."></textarea>
        </div>

        <div class="settingsSection">
            <label>Tự dán ảnh kết quả về Photoshop</label>
            <label class="checkboxLabel">
                <input type="checkbox" id="autoPlaceCheckbox" checked />
                <span>Khi sao chép từ Gemini</span>
            </label>
            <label class="checkboxLabel">
                <input type="checkbox" id="autoPlaceDlCheckbox" />
                <span>Khi tải về</span>
            </label>
            <div id="autoPlaceDlOptions" class="subOptions">
                <div class="settingsRow">
                    <input type="text" id="autoPlaceDirInput" class="textInput" placeholder="Thư mục Downloads" />
                    <button id="browseDirBtn" class="smallBtn">Chọn...</button>
                </div>
                <input type="text" id="autoPlacePrefixInput" class="textInput" placeholder="Tên file bắt đầu bằng (để trống = mọi ảnh)" title="Chỉ dán file có tên bắt đầu bằng chuỗi này. Để trống = mọi file ảnh mới." />
                <label class="checkboxLabel">
                    <input type="checkbox" id="autoPlaceDeleteCheckbox" />
                    <span>Xoá file ảnh sau khi dán xong</span>
                </label>
            </div>
        </div>

        <hr class="divider" />

        <div class="settingsSection checkboxRow">
            <label class="checkboxLabel">
                <input type="checkbox" id="hideStatusCheckbox" />
                <span>Ẩn dòng trạng thái</span>
            </label>
        </div>

        <button id="settingsCloseBtn" class="closeBtn">Đóng cài đặt</button>
    </div>

    <div id="aiStatus"></div>

    <script src="./CSInterface.js"></script>
    <script src="./main.js"></script>
</body>
</html>
